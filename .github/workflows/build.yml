name: Build LSPosed Module

on:
  push:
    branches: [ main, master ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Provide keystore
        run: |
          if [ -n "${{ secrets.MH_KEYSTORE_B64 }}" ]; then
            echo "${{ secrets.MH_KEYSTORE_B64 }}" | base64 -d > mh.jks
            echo "keystore from secret"
          else
            keytool -genkeypair -keystore mh.jks -alias mh -keyalg RSA -keysize 2048 \
              -validity 10950 -storepass 123456 -keypass 123456 \
              -dname "CN=mhhook, OU=fj, O=fj, L=CN, ST=CN, C=CN"
            echo "keystore generated"
          fi

      - name: Build release
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Locate APK
        id: apk
        run: |
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          echo "Found: $APK"
          test -n "$APK"
          cp "$APK" mhhook-3.0.apk
          ls -l mhhook-3.0.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mhhook
          path: mhhook-3.0.apk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('build-{0}', github.run_number) }}
          name: "mhhook ${{ github.ref_name }}"
          files: mhhook-3.0.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
